<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Place Value (Up to 999)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f7fafc;
            color: #2d3748;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        h1 { color: #1a365d; margin: 0 0 5px 0; font-size: 2rem; }
        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .streak { color: #dd6b20; }
        .high-score { color: #3182ce; }
        .target-box {
            font-size: 2.8rem;
            font-weight: 800;
            color: #2b6cb0;
            background: #ebf8ff;
            padding: 12px 30px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 20px;
            border: 2px solid #bee3f8;
        }
        
        /* Blocks Visualization */
        .visual-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #edf2f7;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            min-height: 120px;
        }
        .block-zone {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            justify-content: center;
            gap: 4px;
            padding: 5px;
            background: rgba(255,255,255,0.6);
            border-radius: 8px;
        }
        .flat {
            width: 32px;
            height: 32px;
            background: #ecc94b;
            border: 1px solid #d69e2e;
            box-sizing: border-box;
            background-image: linear-gradient(to right, transparent 9%, rgba(0,0,0,0.15) 9%, rgba(0,0,0,0.15) 10%, transparent 10%), linear-gradient(to bottom, transparent 9%, rgba(0,0,0,0.15) 9%, rgba(0,0,0,0.15) 10%, transparent 10%);
            background-size: 3.2px 3.2px;
        }
        .rod {
            width: 8px;
            height: 40px;
            background: #ed8936;
            border: 1px solid #dd6b20;
            box-sizing: border-box;
            background-image: linear-gradient(to bottom, transparent 9%, rgba(0,0,0,0.15) 9%, rgba(0,0,0,0.15) 10%, transparent 10%);
            background-size: 8px 4px;
        }
        .unit {
            width: 8px;
            height: 8px;
            background: #48bb78;
            border: 1px solid #38a169;
        }

        /* Inputs Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .column {
            padding: 15px;
            border-radius: 12px;
            border: 2px dashed #cbd5e0;
        }
        .hundreds { background-color: #fefcbf; border-color: #ecc94b; }
        .tens { background-color: #feebc8; border-color: #ed8936; }
        .ones { background-color: #c6f6d5; border-color: #48bb78; }
        .label { font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; color: #2d3748; }
        
        input[type="number"] {
            width: 80%;
            padding: 8px;
            font-size: 1.4rem;
            text-align: center;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            outline: none;
        }
        input[type="number"]:focus { border-color: #4299e1; }

        /* Expanded Form Section */
        .expanded-section {
            background: #f7fafc;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            margin-bottom: 25px;
        }
        .expanded-title { font-weight: bold; margin-bottom: 10px; color: #4a5568; }
        .expanded-inputs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.3rem;
            font-weight: bold;
        }
        .expanded-inputs input {
            width: 70px;
            padding: 8px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
        }

        button {
            background-color: #4299e1;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(66, 153, 225, 0.2);
            transition: all 0.2s;
        }
        button:hover { background-color: #3182ce; transform: translateY(-1px); }
        .feedback {
            margin-top: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 35px;
        }
        .correct { color: #38a169; }
        .incorrect { color: #e53e3e; }
    </style>
</head>
<body>

<div class="container">
    <h1>Place Value Master</h1>
    
    <div class="score-board">
        <span class="streak">🔥 Streak: <span id="streakCount">0</span></span>
        <span class="high-score">🏆 Best: <span id="highScoreCount">0</span></span>
    </div>
    
    <div class="target-box" id="targetNumber">---</div>
    
    <!-- Base-10 Block Visuals -->
    <div class="visual-display">
        <div class="block-zone" id="hundredsBlocks"></div>
        <div class="block-zone" id="tensBlocks"></div>
        <div class="block-zone" id="onesBlocks"></div>
    </div>
    
    <!-- Place Value Inputs -->
    <div class="grid">
        <div class="column hundreds">
            <div class="label">Hundreds</div>
            <input type="number" id="inputHundreds" min="0" max="9" placeholder="0" oninput="updateBlocks(); clearFeedback();">
        </div>
        <div class="column tens">
            <div class="label">Tens</div>
            <input type="number" id="inputTens" min="0" max="9" placeholder="0" oninput="updateBlocks(); clearFeedback();">
        </div>
        <div class="column ones">
            <div class="label">Ones</div>
            <input type="number" id="inputOnes" min="0" max="9" placeholder="0" oninput="updateBlocks(); clearFeedback();">
        </div>
    </div>

    <!-- Expanded Form Inputs -->
    <div class="expanded-section">
        <div class="expanded-title">Expanded Form Equation</div>
        <div class="expanded-inputs">
            <input type="number" id="expH" placeholder="000" oninput="clearFeedback()">
            <span>+</span>
            <input type="number" id="expT" placeholder="00" oninput="clearFeedback()">
            <span>+</span>
            <input type="number" id="expO" placeholder="0" oninput="clearFeedback()">
        </div>
    </div>

    <button id="actionBtn" onclick="checkAnswer()">Check Answer</button>
    <div class="feedback" id="feedback"></div>
</div>

<script>
    let currentNumber = 0;
    let targetH = 0, targetT = 0, targetO = 0;
    let streak = 0;
    let highScore = 0;
    let isCorrectState = false;

    function generateNumber() {
        currentNumber = Math.floor(Math.random() * 900) + 100;
        
        targetH = Math.floor(currentNumber / 100);
        targetT = Math.floor((currentNumber % 100) / 10);
        targetO = currentNumber % 10;

        document.getElementById('targetNumber').innerText = currentNumber;
        
        // Reset Inputs
        document.getElementById('inputHundreds').value = '';
        document.getElementById('inputTens').value = '';
        document.getElementById('inputOnes').value = '';
        document.getElementById('expH').value = '';
        document.getElementById('expT').value = '';
        document.getElementById('expO').value = '';
        
        // Clear Blocks & Feedback
        updateBlocks();
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').className = 'feedback';
        
        // Reset Button
        const btn = document.getElementById('actionBtn');
        btn.innerText = "Check Answer";
        btn.setAttribute("onclick", "checkAnswer()");
        isCorrectState = false;
    }

    function updateBlocks() {
        // Read current text values or default to 0
        const h = parseInt(document.getElementById('inputHundreds').value) || 0;
        const t = parseInt(document.getElementById('inputTens').value) || 0;
        const o = parseInt(document.getElementById('inputOnes').value) || 0;

        // Render Hundreds Flats
        const hZone = document.getElementById('hundredsBlocks');
        hZone.innerHTML = '';
        for(let i=0; i < Math.min(h, 9); i++) { hZone.innerHTML += '<div class="flat"></div>'; }

        // Render Tens Rods
        const tZone = document.getElementById('tensBlocks');
        tZone.innerHTML = '';
        for(let i=0; i < Math.min(t, 9); i++) { tZone.innerHTML += '<div class="rod"></div>'; }

        // Render Ones Units
        const oZone = document.getElementById('onesBlocks');
        oZone.innerHTML = '';
        for(let i=0; i < Math.min(o, 9); i++) { oZone.innerHTML += '<div class="unit"></div>'; }
    }

    function checkAnswer() {
        const h = parseInt(document.getElementById('inputHundreds').value) || 0;
        const t = parseInt(document.getElementById('inputTens').value) || 0;
        const o = parseInt(document.getElementById('inputOnes').value) || 0;

        const expH = parseInt(document.getElementById('expH').value) || 0;
        const expT = parseInt(document.getElementById('expT').value) || 0;
        const expO = parseInt(document.getElementById('expO').value) || 0;

        const feedbackDiv = document.getElementById('feedback');

        // Validate both standard parts and expanded notation parts
        const placeValueCorrect = (h === targetH && t === targetT && o === targetO);
        const expandedCorrect = (expH === (targetH * 100) && expT === (targetT * 10) && expO === targetO);

        if (placeValueCorrect && expandedCorrect) {
            feedbackDiv.innerText = "🎉 Brilliant! Everything matches perfectly!";
            feedbackDiv.className = "feedback correct";
            
            streak++;
            if (streak > highScore) { highScore = streak; }
            updateScores();

            const btn = document.getElementById('actionBtn');
            btn.innerText = "Next Challenge 👉";
            btn.setAttribute("onclick", "generateNumber()");
            isCorrectState = true;
        } else {
            feedbackDiv.innerText = "❌ Keep trying! Check both your blocks and your addition.";
            feedbackDiv.className = "feedback incorrect";
            streak = 0; 
            updateScores();
        }
    }

    function clearFeedback() {
        if (!isCorrectState) { document.getElementById('feedback').innerText = ''; }
    }

    function updateScores() {
        document.getElementById('streakCount').innerText = streak;
        document.getElementById('highScoreCount').innerText = highScore;
    }

    window.onload = generateNumber;
</script>

</body>
</html>
