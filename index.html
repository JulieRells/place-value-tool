<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Value Playground</title>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    text-align:center;
    background:#f7fafc;
    margin:0;
    padding:15px;
}

.container{
    max-width:950px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.target-box{
    font-size:2.8rem;
    font-weight:bold;
    color:#2b6cb0;
}

/* Expanded form */
.expanded-box{
    margin-top:10px;
    font-size:1.2rem;
    color:#4a5568;
}

/* Supply Dock */
.supply-dock{
    display:flex;
    justify-content:center;
    gap:80px;
    margin:25px 0;
    padding:20px;
    background:#edf2f7;
    border:2px solid #e2e8f0;
    border-radius:14px;
}

.dock-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    font-weight:bold;
}

/* Grid */
.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:25px;
}

.column{
    border:2px dashed #cbd5e0;
    border-radius:12px;
    padding:12px;
    min-height:260px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.hundreds{background:#fefcbf;}
.tens{background:#feebc8;}
.ones{background:#c6f6d5;}

.label{
    font-size:1.2rem;
    font-weight:bold;
    margin-bottom:10px;
}

.drop-zone{
    width:100%;
    min-height:180px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
}

/* Blocks */
.flat{
    width:55px;height:55px;
    background:#ecc94b;
    border:2px solid #b7791f;
    background-image:
        linear-gradient(to right, rgba(0,0,0,0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.25) 1px, transparent 1px);
    background-size:5px 5px;
    cursor:grab;
}

.rod{
    width:16px;height:70px;
    background:#ed8936;
    border:2px solid #c05621;
    background-image:
        linear-gradient(to bottom, rgba(0,0,0,0.35) 1px, transparent 1px);
    background-size:100% 7px;
    cursor:grab;
}

.unit{
    width:16px;height:16px;
    background:#48bb78;
    border:2px solid #2f855a;
    cursor:grab;
}

/* Feedback */
.error-highlight{outline:4px solid #e53e3e;}
.correct-highlight{outline:4px solid #38a169;}

button{
    padding:10px 20px;
    margin:6px;
    font-weight:bold;
    cursor:pointer;
}

.feedback{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Place Value Playground</h1>

<p id="modeIndicator"></p>
<p><strong>Problem <span id="problemNumber">1</span> of 6</strong></p>

<div class="target-box" id="targetNumber">---</div>

<!-- Expanded form -->
<div class="expanded-box" id="expandedForm"></div>

<!-- Supply Dock -->
<div class="supply-dock">
    <div class="dock-item">
        <div class="flat" draggable="true" ondragstart="drag(event,'hundred')"></div>
        <span>Hundreds</span>
    </div>
    <div class="dock-item">
        <div class="rod" draggable="true" ondragstart="drag(event,'ten')"></div>
        <span>Tens</span>
    </div>
    <div class="dock-item">
        <div class="unit" draggable="true" ondragstart="drag(event,'one')"></div>
        <span>Ones</span>
    </div>
</div>

<!-- Columns -->
<div class="grid">
    <div class="column hundreds" ondragover="allowDrop(event)" ondrop="drop(event,'hundreds')">
        <div class="label">Hundreds</div>
        <div class="drop-zone" id="zoneHundreds"></div>
    </div>
    <div class="column tens" ondragover="allowDrop(event)" ondrop="drop(event,'tens')">
        <div class="label">Tens</div>
        <div class="drop-zone" id="zoneTens"></div>
    </div>
    <div class="column ones" ondragover="allowDrop(event)" ondrop="drop(event,'ones')">
        <div class="label">Ones</div>
        <div class="drop-zone" id="zoneOnes"></div>
    </div>
</div>

<button onclick="checkAnswer()">Check</button>
<button onclick="clearWorkspace()">Clear</button>

<br>

<button id="nextSlideBtn" style="display:none;" onclick="goToNextSlide()">
👉 Return to Nearpod
</button>

<div class="feedback" id="feedback"></div>

</div>

<script>

let currentNumber;
let targetH,targetT,targetO;
let currentH=0,currentT=0,currentO=0;

let problemCount=0;
const maxProblems=6;

/* Generate */
function generateNumber(){

    if(problemCount>=maxProblems){
        document.getElementById('targetNumber').innerText="Done!";
        document.getElementById('feedback').innerText=
        "🎉 Great work! Click below to return to Nearpod.";
        document.getElementById('nextSlideBtn').style.display="inline-block";
        return;
    }

    problemCount++;
    document.getElementById('problemNumber').innerText=problemCount;

    currentNumber=Math.floor(Math.random()*900)+100;

    targetH=Math.floor(currentNumber/100);
    targetT=Math.floor((currentNumber%100)/10);
    targetO=currentNumber%10;

    document.getElementById('targetNumber').innerText=currentNumber;

    /* Expanded form */
    document.getElementById('expandedForm').innerText =
        `${targetH*100} + ${targetT*10} + ${targetO}`;

    clearWorkspace();
    updateMode();
}

/* Mode */
function updateMode(){
    document.getElementById('modeIndicator').innerText =
        problemCount<=3
        ? "Guided Mode: Place blocks in the correct column"
        : "Challenge Mode: Blocks can go anywhere!";
}

/* Drag */
function drag(ev,type){
    ev.dataTransfer.setData("text",type);
}

function allowDrop(ev){
    ev.preventDefault();
}

/* Drop */
function drop(ev,column){
    ev.preventDefault();

    let type=ev.dataTransfer.getData("text");
    let guided=problemCount<=3;

    if(guided){
        if(column==="hundreds" && type!=="hundred") return;
        if(column==="tens" && type!=="ten") return;
        if(column==="ones" && type!=="one") return;
    }

    addBlock(column);
}

/* Add */
function addBlock(column){

    let div=document.createElement("div");

    if(column==="hundreds"){
        currentH++; div.className="flat";
        zoneHundreds.appendChild(div);
    }
    if(column==="tens"){
        currentT++; div.className="rod";
        zoneTens.appendChild(div);
    }
    if(column==="ones"){
        currentO++; div.className="unit";
        zoneOnes.appendChild(div);
    }

    div.onclick=function(){
        this.remove();
        if(column==="hundreds") currentH--;
        if(column==="tens") currentT--;
        if(column==="ones") currentO--;
    };
}

/* Clear */
function clearWorkspace(){
    currentH=0; currentT=0; currentO=0;
    zoneHundreds.innerHTML="";
    zoneTens.innerHTML="";
    zoneOnes.innerHTML="";

    document.querySelectorAll('.column').forEach(c=>{
        c.classList.remove('error-highlight','correct-highlight');
    });
}

/* Check */
function checkAnswer(){

    const feedback=document.getElementById('feedback');
    const colH=document.querySelector('.hundreds');
    const colT=document.querySelector('.tens');
    const colO=document.querySelector('.ones');

    colH.classList.remove('error-highlight','correct-highlight');
    colT.classList.remove('error-highlight','correct-highlight');
    colO.classList.remove('error-highlight','correct-highlight');

    if(currentH===targetH && currentT===targetT && currentO===targetO){

        feedback.innerText="🎉 Excellent!";

        colH.classList.add('correct-highlight');
        colT.classList.add('correct-highlight');
        colO.classList.add('correct-highlight');

        setTimeout(generateNumber,1200);

    } else {

        let msg="Check your work: ";

        if(currentH!==targetH){
            colH.classList.add('error-highlight');
            msg+=currentH>targetH?"Too many hundreds. ":"Add more hundreds. ";
        } else colH.classList.add('correct-highlight');

        if(currentT!==targetT){
            colT.classList.add('error-highlight');
            msg+=currentT>targetT?"Too many tens. ":"Add more tens. ";
        } else colT.classList.add('correct-highlight');

        if(currentO!==targetO){
            colO.classList.add('error-highlight');
            msg+=currentO>targetO?"Too many ones. ":"Add more ones. ";
        } else colO.classList.add('correct-highlight');

        feedback.innerText=msg;
    }
}

/* Return */
function goToNextSlide(){
    alert("Close this tab and return to Nearpod, then click NEXT.");
}

window.onload=generateNumber;

</script>

</body>
</html>
