<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Break a Ten Tool</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f5f7fa;
}

h1 { margin-top: 20px; }

.container {
  display: flex;
  justify-content: center;
  gap: 80px;
  margin-top: 20px;
}

.column {
  border: 2px solid #333;
  padding: 20px;
  width: 200px;
  min-height: 320px;
  background: white;
}

.label {
  font-weight: bold;
  margin-bottom: 10px;
}

.ten {
  width: 20px;
  height: 100px;
  background: #4CAF50;
  margin: 5px auto;
  border-radius: 4px;
  transition: transform 0.6s, opacity 0.6s;
}

.breaking {
  transform: scaleY(0.2);
  opacity: 0;
}

.one {
  width: 20px;
  height: 20px;
  margin: 3px;
  display: inline-block;
  border-radius: 3px;
}

.original { background: #2196F3; }
.regrouped { background: #FF9800; }

button {
  margin: 8px;
  padding: 10px 15px;
  font-size: 14px;
  cursor: pointer;
}

#instruction {
  font-size: 18px;
  margin-top: 10px;
  font-weight: bold;
}

#math {
  margin-top: 10px;
  font-size: 16px;
}
</style>
</head>

<body>

<h1>Break a Ten</h1>

<div id="instruction">Click Start</div>
<div id="math"></div>

<div class="container">
  <div class="column" id="tensColumn">
    <div class="label">Tens</div>
  </div>

  <div class="column" id="onesColumn">
    <div class="label">Ones</div>
  </div>
</div>

<div>
  <button onclick="start()">Start</button>
  <button onclick="breakTen()">Break 1 Ten</button>
  <button onclick="tryAgain()">Try Again</button>
  <button onclick="reset()">Reset</button>
</div>

<script>
let tens = 4;
let onesOriginal = 2;
let onesNew = 0;

function updateMath() {
  document.getElementById("math").innerHTML =
    `Tens: ${tens} | Ones: ${onesOriginal + onesNew}`;
}

function render() {
  const tensCol = document.getElementById("tensColumn");
  const onesCol = document.getElementById("onesColumn");

  tensCol.innerHTML = '<div class="label">Tens</div>';
  onesCol.innerHTML = '<div class="label">Ones</div>';

  for (let i = 0; i < tens; i++) {
    const ten = document.createElement("div");
    ten.className = "ten";
    tensCol.appendChild(ten);
  }

  for (let i = 0; i < onesOriginal; i++) {
    const one = document.createElement("div");
    one.className = "one original";
    onesCol.appendChild(one);
  }

  for (let i = 0; i < onesNew; i++) {
    const one = document.createElement("div");
    one.className = "one regrouped";
    onesCol.appendChild(one);
  }
}

function start() {
  document.getElementById("instruction").innerText =
    "We have 4 tens and 2 ones";
  updateMath();
  render();
}

function breakTen() {
  if (tens > 0) {
    document.getElementById("instruction").innerText =
      "Watch: 1 ten becomes 10 ones";

    const lastTen = document.querySelector(".ten:last-child");

    if (lastTen) {
      lastTen.classList.add("breaking");

      setTimeout(() => {
        tens--;
        animateOnes();
      }, 600);
    }
  }
}

function animateOnes() {
  let count = 0;
  let interval = setInterval(() => {
    if (count < 10) {
      onesNew++;
      render();
      count++;
    } else {
      clearInterval(interval);
      document.getElementById("instruction").innerText =
        "Now we have " + tens + " tens and " + (onesOriginal + onesNew) + " ones";
      updateMath();
    }
  }, 120);
}

function tryAgain() {
  document.getElementById("instruction").innerText =
    "Try breaking another ten. What happens now?";
}

function reset() {
  tens = 4;
  onesOriginal = 2;
  onesNew = 0;
  document.getElementById("instruction").innerText = "Click Start";
  document.getElementById("math").innerHTML = "";
  render();
}

render();
</script>

</body>
</html>
